<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Presente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-container">
    <h1>Crie seu presente ❤️</h1>
    <p>Preencha as informações para montar a retrospectiva do casal.</p>

    <form id="formPresente">
      <label>Nome do casal</label>
      <input type="text" id="nomeCasal" placeholder="Ex: Ana & Lucas" required>

      <label>História do casal</label>
      <textarea id="historia" placeholder="Conte como tudo começou..." required></textarea>

      <label>Música do casal</label>
      <input type="text" id="musica" placeholder="Ex: Perfect - Ed Sheeran">

      <label>Momento inesquecível</label>
      <textarea id="momento" placeholder="Ex: Nossa primeira viagem..."></textarea>

      <button type="submit">Criar presente</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
